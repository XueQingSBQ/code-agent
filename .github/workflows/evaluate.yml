name: SWE-bench Evaluation

on:
  schedule:
    # Run at 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      max-instances:
        description: 'Maximum number of instances to evaluate'
        required: false
        default: '20'
      model:
        description: 'Model to use'
        required: false
        default: 'claude-sonnet-4-20250514'

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download SWE-bench Lite dataset
        run: |
          mkdir -p data
          wget -O data/swebench_lite.json \
            https://raw.githubusercontent.com/princeton-nlp/SWE-bench/main/swebench/harness/constants.py
          # Note: Update URL to actual dataset location

      - name: Run evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run python -m evals.swebench.cli \
            --dataset data/swebench_lite.json \
            --output ./eval_results \
            --api-key $ANTHROPIC_API_KEY \
            --model ${{ github.event.inputs.model || 'claude-sonnet-4-20250514' }} \
            --max-instances ${{ github.event.inputs.max-instances || '20' }} \
            --parallel 2

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: swebench-eval-results-${{ github.run_id }}
          path: eval_results/

      - name: Comment on PR (if triggered by PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('eval_results/aggregate_report.json', 'utf8'));

            const body = `## SWE-bench Evaluation Results

            **Resolve Rate**: ${report.aggregate.resolve_rate}
            **Total Cost**: ${report.aggregate.total_cost_usd}
            **Avg Cost/Instance**: ${report.aggregate.avg_cost_per_instance}
            **Avg Tokens/Instance**: ${report.aggregate.avg_tokens_per_instance}
            **Total Instances**: ${report.aggregate.total_instances}

            Full results available in artifacts.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Check for performance regression
        run: |
          # Compare with baseline (implement regression check)
          echo "Checking for performance regression..."
          # TODO: Implement baseline comparison
